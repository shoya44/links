<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="links">
  <title>links</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    :root{
      --bg-primary:#0a0a0f;
      --bg-secondary:#1c1c24;
      --bg-tertiary:#2c2c36;
      --text-primary:#f5f5f7;
      --text-secondary:#98989e;
      --text-tertiary:#6e6e76;
      --accent:#0a84ff;
      --danger:#ff453a;
      --separator:#2c2c36;
      --radius-sm:8px;
      --radius-md:12px;
      --radius-lg:16px;
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px)
    }
    *{
      margin:0;padding:0;box-sizing:border-box;
      -webkit-touch-callout:none;
      -webkit-user-select:none;
      -khtml-user-select:none;
      -moz-user-select:none;
      -ms-user-select:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation
    }
    input,textarea{
      -webkit-user-select:text;
      user-select:text;
      -webkit-touch-callout:default
    }
    html,body{
      height:100%;
      background:var(--bg-primary);
      color:var(--text-primary);
      font-family:var(--font);
      -webkit-font-smoothing:antialiased;
      overscroll-behavior:none
    }
    #app{
      display:flex;flex-direction:column;height:100%;
      max-width:600px;margin:0 auto;
      padding-top:var(--safe-top);
      padding-bottom:var(--safe-bottom)
    }
    /* ヘッダー */
    .header{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 20px 12px;flex-shrink:0;
      min-height:56px
    }
    .header-logo{
      width:28px;height:28px;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0
    }
    .header-logo svg{
      width:100%;height:100%;
      stroke:var(--text-primary);
      stroke-width:2;fill:none;
      stroke-linecap:round;stroke-linejoin:round
    }
    .header-btn{
      display:flex;align-items:center;gap:6px;
      background:none;border:none;
      color:var(--accent);
      font-size:15px;font-weight:500;font-family:var(--font);
      padding:8px 12px;border-radius:var(--radius-sm);
      cursor:pointer;transition:opacity .2s
    }
    .header-btn:active{opacity:.5}
    .header-btn.primary{font-weight:600}
    .header-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    /* モード切替 */
    .mode{
      display:none;flex:1;overflow-y:auto;
      padding:0 16px 24px;-webkit-overflow-scrolling:touch
    }
    .mode.active{display:flex;flex-direction:column}
    /* リンクリスト */
    .link-list{list-style:none;display:flex;flex-direction:column;gap:8px}
    .link-item{
      display:flex;align-items:center;gap:14px;
      background:var(--bg-secondary);border-radius:var(--radius-md);
      padding:14px 16px;min-height:60px;cursor:pointer;
      transition:transform .2s cubic-bezier(0.25,0.46,0.45,0.94),background-color .2s,box-shadow .2s
    }
    .link-item:active{transform:scale(.98);background-color:var(--bg-tertiary)}
    .link-icon{
      width:40px;height:40px;border-radius:10px;
      background:var(--bg-tertiary);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;overflow:hidden
    }
    .link-icon svg{
      width:20px;height:20px;
      stroke:var(--text-primary);stroke-width:2;
      fill:none;stroke-linecap:round;stroke-linejoin:round
    }
    .link-icon img{width:100%;height:100%;object-fit:cover;border-radius:10px}
    .link-title{
      flex:1;font-size:16px;font-weight:500;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis
    }
    .link-arrow{color:var(--text-tertiary);font-size:14px;flex-shrink:0}
    /* 空状態 */
    .empty-state{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      flex:1;color:var(--text-tertiary);gap:12px;padding:40px 0
    }
    .empty-icon{font-size:48px}
    .empty-text{font-size:15px}
    /* 編集モード */
    .edit-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:0 0 12px;flex-shrink:0;
      min-height:56px
    }
    .edit-list{gap:12px}
    .edit-item{
      display:flex;flex-direction:column;
      background:var(--bg-secondary);border-radius:var(--radius-md);
      padding:12px 16px;gap:8px;
      transition:transform .2s cubic-bezier(0.25,0.46,0.45,0.94),box-shadow .2s,background-color .2s
    }
    .edit-item .row-top{display:flex;align-items:center;gap:12px}
    .drag-handle{
      cursor:grab;
      color:var(--text-tertiary);
      padding:8px;
      flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      min-width:36px;min-height:36px;
      border-radius:var(--radius-sm);
      transition:background-color .2s
    }
    .drag-handle:active{
      cursor:grabbing;
      background:var(--bg-tertiary)
    }
    .drag-handle svg{
      width:20px;height:20px;
      stroke:currentColor;stroke-width:2;
      fill:none;stroke-linecap:round;stroke-linejoin:round
    }
    .edit-icon{
      width:36px;height:36px;border-radius:8px;
      background:var(--bg-tertiary);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;overflow:hidden;cursor:pointer;
      transition:opacity .2s
    }
    .edit-icon:active{opacity:.7}
    .edit-icon svg{
      width:18px;height:18px;
      stroke:var(--text-primary);stroke-width:2;
      fill:none;stroke-linecap:round;stroke-linejoin:round
    }
    .edit-icon img{width:100%;height:100%;object-fit:cover}
    .edit-item input{
      background:transparent;border:none;
      color:var(--text-primary);font-family:var(--font);
      font-size:15px;outline:none;flex:1;min-width:0;
      padding:4px 0;border-bottom:1px solid var(--separator);
      transition:border-color .2s
    }
    .edit-item input:focus{border-bottom-color:var(--accent)}
    .edit-item input::placeholder{color:var(--text-tertiary)}
    .edit-item input.input-url{font-size:13px;color:var(--text-secondary)}
    .delete-btn{
      background:none;border:none;color:var(--danger);
      cursor:pointer;padding:8px;flex-shrink:0;
      border-radius:var(--radius-sm);transition:background-color .2s;
      display:flex;align-items:center;justify-content:center;
      min-width:36px;min-height:36px
    }
    .delete-btn:active{background-color:rgba(255,69,58,.15)}
    .delete-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
    /* 追加ボタン */
    .add-btn{
      display:flex;align-items:center;justify-content:center;gap:8px;
      background:var(--bg-secondary);border:1px dashed var(--separator);
      color:var(--text-secondary);font-family:var(--font);
      font-size:15px;font-weight:500;padding:16px;border-radius:var(--radius-md);
      cursor:pointer;margin-top:12px;transition:background-color .2s,color .2s
    }
    .add-btn:active{background:var(--bg-tertiary);color:var(--text-primary)}
    .add-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
    /* アイコンピッカーモーダル */
    .icon-modal-overlay{
      position:fixed;top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,.6);z-index:100;
      display:flex;align-items:center;justify-content:center;
      animation:fadeIn .2s ease
    }
    .icon-modal{
      background:var(--bg-secondary);
      border-radius:var(--radius-lg);
      padding:20px;width:340px;max-width:90vw;
      box-shadow:0 8px 32px rgba(0,0,0,.5);
      max-height:80vh;overflow-y:auto
    }
    .icon-modal-title{
      font-size:15px;font-weight:600;color:var(--text-primary);
      margin-bottom:16px;text-align:center
    }
    .icon-grid{
      display:grid;grid-template-columns:repeat(6,1fr);
      gap:8px;margin-bottom:16px
    }
    .icon-option{
      width:48px;height:48px;border-radius:var(--radius-sm);
      background:var(--bg-tertiary);border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background-color .2s,transform .15s;
      color:var(--text-primary)
    }
    .icon-option:active{background:var(--separator);transform:scale(.9)}
    .icon-option svg{
      width:22px;height:22px;
      stroke:currentColor;stroke-width:2;
      fill:none;stroke-linecap:round;stroke-linejoin:round
    }
    .icon-option.selected{
      background:var(--accent);
      color:#fff
    }
    .icon-modal-close{
      width:100%;padding:10px;border:none;
      background:var(--bg-tertiary);color:var(--text-secondary);
      font-family:var(--font);font-size:14px;font-weight:500;
      border-radius:var(--radius-sm);cursor:pointer;
      transition:background-color .2s
    }
    .icon-modal-close:active{background:var(--separator)}
    /* アニメーション */
    @keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .link-item,.edit-item{animation:fadeInUp .25s ease both}
    /* SortableJS ドラッグ中のスタイル */
    .sortable-ghost{
      opacity:.4;
      background:var(--bg-tertiary)
    }
    .sortable-chosen{
      background:var(--bg-tertiary)
    }
    .sortable-drag{
      opacity:1!important;
      background:var(--bg-tertiary);
      transform:scale(1.03);
      box-shadow:0 16px 32px rgba(0,0,0,.5);
      transition:transform .2s cubic-bezier(0.25,0.46,0.45,0.94),box-shadow .2s;
      z-index:1000
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 通常モードヘッダー -->
    <header class="header" id="normalHeader">
      <div class="header-logo" aria-label="links">
        <svg viewBox="0 0 24 24">
          <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <button id="editBtn" class="header-btn" aria-label="Edit">
        <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Edit
      </button>
    </header>

    <!-- 編集モードヘッダー -->
    <header class="header" id="editHeader" style="display:none">
      <button id="cancelBtn" class="header-btn" aria-label="Cancel">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        Cancel
      </button>
      <div class="header-logo" aria-label="links">
        <svg viewBox="0 0 24 24">
          <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <button id="saveBtn" class="header-btn primary" aria-label="Save">
        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
        Save
      </button>
    </header>

    <!-- 通常モード -->
    <main id="normalMode" class="mode active">
      <ul id="linkList" class="link-list"></ul>
    </main>

    <!-- 編集モード -->
    <main id="editMode" class="mode">
      <ul id="editList" class="link-list edit-list"></ul>
      <button id="addBtn" class="add-btn" aria-label="Add link">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Add
      </button>
    </main>
  </div>

  <!-- アイコンピッカーモーダル -->
  <div id="iconModal" class="icon-modal-overlay" style="display:none">
    <div class="icon-modal">
      <div class="icon-modal-title">アイコンを選択</div>
      <div class="icon-grid" id="iconGrid"></div>
      <button class="icon-modal-close" id="iconClose">キャンセル</button>
    </div>
  </div>

  <script>
    // ===== SVGアイコン定義（Lucide/Feather風） =====
    const SVG_ICONS = {
      'link': '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>',
      'file': '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
      'table': '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',
      'calendar': '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
      'mail': '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>',
      'chat': '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',
      'settings': '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
      'folder': '<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>',
      'chart': '<svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>',
      'clock': '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
      'wallet': '<svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 010-4h14v4"/><path d="M3 5v14a2 2 0 002 2h16v-5"/><path d="M18 12a2 2 0 000 4h4v-4z"/></svg>',
      'cloud': '<svg viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/></svg>',
      'book': '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>',
      'briefcase': '<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>',
      'home': '<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>',
      'user': '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      'check': '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
      'pen': '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
      'star': '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>',
      'heart': '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>',
      'bell': '<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>',
      'globe': '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>',
      'download': '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',
      'code': '<svg viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>'
    };
    const ICON_NAMES = Object.keys(SVG_ICONS);

    // ===== IndexedDB =====
    const DB_NAME='link-launcher',DB_VERSION=1,STORE_NAME='links';
    let db,links=[],editModeItems=[],isEditMode=false,sortableInstance=null;
    let iconTargetItem=null;
    let iconTargetRow=null;

    function openDB(){
      return new Promise((res,rej)=>{
        const req=indexedDB.open(DB_NAME,DB_VERSION);
        req.onupgradeneeded=e=>{
          const d=e.target.result;
          if(!d.objectStoreNames.contains(STORE_NAME)){
            const s=d.createObjectStore(STORE_NAME,{keyPath:'id'});
            s.createIndex('url','url',{unique:true});
            s.createIndex('order','order')
          }
        };
        req.onsuccess=()=>{db=req.result;res(db)};
        req.onerror=()=>rej(req.error)
      })
    }
    function getAllLinks(){
      return new Promise((res,rej)=>{
        const tx=db.transaction(STORE_NAME,'readonly'),st=tx.objectStore(STORE_NAME),req=st.getAll();
        req.onsuccess=()=>{const l=req.result||[];l.sort((a,b)=>a.order-b.order);res(l)};
        req.onerror=()=>rej(req.error)
      })
    }
    function saveLink(link){
      return new Promise((res,rej)=>{
        const tx=db.transaction(STORE_NAME,'readwrite'),st=tx.objectStore(STORE_NAME);
        st.put(link);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)
      })
    }
    function deleteLink(id){
      return new Promise((res,rej)=>{
        const tx=db.transaction(STORE_NAME,'readwrite'),st=tx.objectStore(STORE_NAME);
        st.delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)
      })
    }
    function generateId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

    // ===== ユーティリティ =====
    function getFaviconUrl(url){
      try{return 'https://www.google.com/s2/favicons?domain='+new URL(url).hostname+'&sz=64'}catch{return ''}
    }
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
    function isValidUrl(s){try{new URL(s);return true}catch{return false}}
    function haptic(){if(navigator.vibrate)navigator.vibrate(10)}
    function isGoogleUrl(url){
      return url.includes('google.com')||url.includes('google.co.jp')||url.includes('accounts.google')
    }
    function isSheetsUrl(url){return url.includes('docs.google.com/spreadsheets')}
    function isDocsUrl(url){return url.includes('docs.google.com/document')}
    function isSlidesUrl(url){return url.includes('docs.google.com/presentation')}

    function renderIcon(link){
      // SVGアイコン名が設定されている場合
      if(link.icon && SVG_ICONS[link.icon]){
        return SVG_ICONS[link.icon];
      }
      // ファビコンURLの場合（既存データ用）
      if(link.icon && (link.icon.startsWith('http')||link.icon.startsWith('data:'))){
        return '<img src="'+link.icon+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\''+SVG_ICONS['link']+'\'">';
      }
      // デフォルト（リンクアイコン）
      return SVG_ICONS['link'];
    }

    // ===== リンクを開く =====
    function openLink(link){
      const url=link.url;
      haptic();
      if(isSheetsUrl(url)){
        const appUrl=url.replace('https://','googlesheets://');
        window.location.href=appUrl;
        setTimeout(()=>{
          if(document.visibilityState==='visible'){
            window.open(url,'_blank','noopener')
          }
        },1500);
        return
      }
      if(isDocsUrl(url)){
        const appUrl=url.replace('https://','googledocs://');
        window.location.href=appUrl;
        setTimeout(()=>{
          if(document.visibilityState==='visible'){
            window.open(url,'_blank','noopener')
          }
        },1500);
        return
      }
      if(isSlidesUrl(url)){
        const appUrl=url.replace('https://','googleslides://');
        window.location.href=appUrl;
        setTimeout(()=>{
          if(document.visibilityState==='visible'){
            window.open(url,'_blank','noopener')
          }
        },1500);
        return
      }
      if(isGoogleUrl(url)){
        const chooserUrl='https://accounts.google.com/AccountChooser?continue='+encodeURIComponent(url)+'&hl=ja';
        window.open(chooserUrl,'_blank','noopener');
        return
      }
      window.open(url,'_blank','noopener')
    }

    // ===== DOM参照 =====
    const normalMode=document.getElementById('normalMode');
    const editMode=document.getElementById('editMode');
    const linkList=document.getElementById('linkList');
    const editList=document.getElementById('editList');
    const editBtn=document.getElementById('editBtn');
    const cancelBtn=document.getElementById('cancelBtn');
    const saveBtn=document.getElementById('saveBtn');
    const addBtn=document.getElementById('addBtn');
    const normalHeader=document.getElementById('normalHeader');
    const editHeader=document.getElementById('editHeader');
    const iconModal=document.getElementById('iconModal');
    const iconGrid=document.getElementById('iconGrid');
    const iconClose=document.getElementById('iconClose');

    // ===== 通常モードのレンダリング =====
    function renderNormalMode(){
      linkList.innerHTML='';
      if(links.length===0){
        linkList.innerHTML='<div class="empty-state"><div class="empty-icon">🔗</div><div class="empty-text">No links yet</div><div class="empty-text" style="font-size:13px;">Tap Edit to add links</div></div>';
        return
      }
      links.forEach((link,i)=>{
        const li=document.createElement('li');
        li.className='link-item';
        li.style.animationDelay=(i*0.03)+'s';
        const iconHtml=renderIcon(link);
        li.innerHTML='<div class="link-icon">'+iconHtml+'</div><span class="link-title">'+escapeHtml(link.title||link.url)+'</span><span class="link-arrow">↗</span>';
        li.addEventListener('click',()=>openLink(link));
        linkList.appendChild(li)
      })
    }

    // ===== 編集モードのレンダリング =====
    function renderEditMode(){
      editList.innerHTML='';
      editModeItems=links.map(l=>({...l}));
      if(editModeItems.length===0)addEditRow();
      editModeItems.forEach((item,i)=>appendEditRow(item,i));
      initSortable()
    }

    function appendEditRow(item,index){
      const li=document.createElement('li');
      li.className='edit-item';
      li.style.animationDelay=(index*0.03)+'s';
      li.dataset.id=item.id;

      const iconHtml=renderIcon(item);

      li.innerHTML=
        '<div class="row-top">'+
          '<span class="drag-handle" aria-label="Drag to reorder">'+
            '<svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.5" fill="currentColor"/><circle cx="15" cy="6" r="1.5" fill="currentColor"/><circle cx="9" cy="12" r="1.5" fill="currentColor"/><circle cx="15" cy="12" r="1.5" fill="currentColor"/><circle cx="9" cy="18" r="1.5" fill="currentColor"/><circle cx="15" cy="18" r="1.5" fill="currentColor"/></svg>'+
          '</span>'+
          '<div class="edit-icon" data-index="'+index+'">'+iconHtml+'</div>'+
          '<input type="text" class="input-title" placeholder="Title" value="'+escapeHtml(item.title||'')+'" aria-label="Title">'+
          '<button class="delete-btn" aria-label="Delete">'+
            '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>'+
          '</button>'+
        '</div>'+
        '<input type="url" class="input-url" placeholder="https://example.com" value="'+escapeHtml(item.url||'')+'" aria-label="URL">';

      const titleInput=li.querySelector('.input-title');
      titleInput.addEventListener('input',()=>{item.title=titleInput.value});

      const urlInput=li.querySelector('.input-url');
      urlInput.addEventListener('input',()=>{
        item.url=urlInput.value;
      });
      urlInput.addEventListener('blur',()=>{
        let v=urlInput.value.trim();
        if(v&&!v.match(/^https?:\/\//)){
          v='https://'+v;
          urlInput.value=v;
          item.url=v;
        }
        // 自動ファビコン取得は行わない（デフォルトはSVGアイコンのまま）
      });

      // アイコンクリック → SVGアイコンピッカー
      const iconDiv=li.querySelector('.edit-icon');
      iconDiv.addEventListener('click',(e)=>{
        e.stopPropagation();
        iconTargetItem=item;
        iconTargetRow=li;
        showIconModal()
      });

      li.querySelector('.delete-btn').addEventListener('click',()=>{
        editModeItems.splice(index,1);
        renderEditMode()
      });

      editList.appendChild(li)
    }

    function updateEditIconDisplay(li,item){
      const iconDiv=li.querySelector('.edit-icon');
      iconDiv.innerHTML=renderIcon(item);
      iconDiv.addEventListener('click',(e)=>{
        e.stopPropagation();
        iconTargetItem=item;
        iconTargetRow=li;
        showIconModal()
      })
    }

    function addEditRow(){
      const newItem={
        id:generateId(),url:'',title:'',icon:'link',order:editModeItems.length,
        createdAt:Date.now(),updatedAt:Date.now()
      };
      editModeItems.push(newItem);
      appendEditRow(newItem,editModeItems.length-1);
      requestAnimationFrame(()=>{
        const rows=editList.querySelectorAll('.edit-item');
        if(rows.length){
          const input=rows[rows.length-1].querySelector('.input-title');
          if(input)input.focus()
        }
      });
      initSortable()
    }

    // ===== SortableJS =====
    function initSortable(){
      if(sortableInstance)sortableInstance.destroy();
      sortableInstance=new Sortable(editList,{
        handle:'.drag-handle',
        animation:300,
        easing:'cubic-bezier(0.25,0.46,0.45,0.94)',
        forceFallback:false,       // ネイティブDnDを優先
        fallbackTolerance:3,
        swapThreshold:0.65,
        delay:200,                  // 200ms長押しで開始
        delayOnTouchOnly:true,      // タッチのみ遅延
        ghostClass:'sortable-ghost',
        chosenClass:'sortable-chosen',
        dragClass:'sortable-drag',
        onStart:()=>{
          haptic();
        },
        onEnd:evt=>{
          const {oldIndex,newIndex}=evt;
          if(oldIndex===newIndex)return;
          const [moved]=editModeItems.splice(oldIndex,1);
          editModeItems.splice(newIndex,0,moved);
          editModeItems.forEach((it,i)=>it.order=i)
        }
      })
    }

    // ===== SVGアイコンピッカー =====
    function showIconModal(){
      iconGrid.innerHTML='';
      ICON_NAMES.forEach(name=>{
        const btn=document.createElement('button');
        btn.className='icon-option';
        btn.innerHTML=SVG_ICONS[name];
        btn.setAttribute('aria-label','Select '+name+' icon');
        btn.dataset.iconName=name;
        if(iconTargetItem && iconTargetItem.icon===name){
          btn.classList.add('selected')
        }
        btn.addEventListener('click',()=>{
          if(iconTargetItem){
            iconTargetItem.icon=name;
            if(iconTargetRow){
              updateEditIconDisplay(iconTargetRow,iconTargetItem)
            }
          }
          hideIconModal()
        });
        iconGrid.appendChild(btn)
      });
      iconModal.style.display='flex'
    }
    function hideIconModal(){
      iconModal.style.display='none';
      iconTargetItem=null;
      iconTargetRow=null
    }
    iconClose.addEventListener('click',hideIconModal);
    iconModal.addEventListener('click',e=>{
      if(e.target===iconModal)hideIconModal()
    });

    // ===== モード切替 =====
    function showNormalMode(){
      isEditMode=false;
      normalMode.classList.add('active');
      editMode.classList.remove('active');
      normalHeader.style.display='flex';
      editHeader.style.display='none';
      renderNormalMode()
    }
    function showEditMode(){
      isEditMode=true;
      normalMode.classList.remove('active');
      editMode.classList.add('active');
      normalHeader.style.display='none';
      editHeader.style.display='flex';
      renderEditMode()
    }
    async function saveAll(){
      const validItems=editModeItems.filter(it=>isValidUrl(it.url));
      validItems.forEach((it,i)=>{it.order=i;it.updatedAt=Date.now()});
      const ids=new Set(validItems.map(i=>i.id));
      for(const l of links){if(!ids.has(l.id))await deleteLink(l.id)}
      for(const it of validItems)await saveLink(it);
      links=validItems;
      showNormalMode()
    }

    // ===== イベント登録 =====
    editBtn.addEventListener('click',()=>showEditMode());
    cancelBtn.addEventListener('click',()=>showNormalMode());
    saveBtn.addEventListener('click',()=>saveAll());
    addBtn.addEventListener('click',()=>addEditRow());

    // ===== ズーム防止 =====
    document.addEventListener('gesturestart',e=>e.preventDefault());
    document.addEventListener('dblclick',e=>e.preventDefault());

    // ===== 初期化 =====
    (async()=>{
      await openDB();
      links=await getAllLinks();
      renderNormalMode();
      if('serviceWorker' in navigator){
        window.addEventListener('load',()=>{
          navigator.serviceWorker.register('service-worker.js')
            .then(()=>console.log('SW registered'))
            .catch(e=>console.log('SW failed',e))
        })
      }
    })();
  </script>
</body>
</html>
