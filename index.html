<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="links">
  <title>links</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    :root{
      --bg-primary:#0a0a0f;
      --bg-secondary:#1c1c24;
      --bg-tertiary:#2c2c36;
      --text-primary:#f5f5f7;
      --text-secondary:#98989e;
      --text-tertiary:#6e6e76;
      --accent:#0a84ff;
      --danger:#ff453a;
      --separator:#2c2c36;
      --radius-sm:8px;
      --radius-md:12px;
      --radius-lg:16px;
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px)
    }
    *{
      margin:0;padding:0;box-sizing:border-box;
      -webkit-touch-callout:none;
      -webkit-user-select:none;
      -khtml-user-select:none;
      -moz-user-select:none;
      -ms-user-select:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation
    }
    input,textarea{
      -webkit-user-select:text;
      user-select:text;
      -webkit-touch-callout:default
    }
    html,body{
      height:100%;
      background:var(--bg-primary);
      color:var(--text-primary);
      font-family:var(--font);
      -webkit-font-smoothing:antialiased;
      overscroll-behavior:none
    }
    #app{
      display:flex;flex-direction:column;height:100%;
      max-width:600px;margin:0 auto;
      padding-top:var(--safe-top);
      padding-bottom:var(--safe-bottom)
    }
    /* ヘッダー */
    .header{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 20px 12px;flex-shrink:0
    }
    .header-title{
      font-size:22px;font-weight:700;letter-spacing:-0.02em;
      text-transform:lowercase
    }
    .header-btn{
      display:flex;align-items:center;gap:6px;
      background:none;border:none;
      color:var(--accent);
      font-size:15px;font-weight:500;font-family:var(--font);
      padding:8px 12px;border-radius:var(--radius-sm);
      cursor:pointer;transition:opacity .2s
    }
    .header-btn:active{opacity:.5}
    .header-btn.primary{font-weight:600}
    .header-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    /* モード切替 */
    .mode{
      display:none;flex:1;overflow-y:auto;
      padding:0 16px 24px;-webkit-overflow-scrolling:touch
    }
    .mode.active{display:flex;flex-direction:column}
    /* リンクリスト */
    .link-list{list-style:none;display:flex;flex-direction:column;gap:8px}
    .link-item{
      display:flex;align-items:center;gap:14px;
      background:var(--bg-secondary);border-radius:var(--radius-md);
      padding:14px 16px;min-height:60px;cursor:pointer;
      transition:transform .15s,background-color .15s
    }
    .link-item:active{transform:scale(.98);background-color:var(--bg-tertiary)}
    .link-icon{
      width:40px;height:40px;border-radius:10px;
      background:var(--bg-tertiary);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;overflow:hidden;font-size:20px
    }
    .link-icon img{width:100%;height:100%;object-fit:cover;border-radius:10px}
    .link-title{
      flex:1;font-size:16px;font-weight:500;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis
    }
    .link-arrow{color:var(--text-tertiary);font-size:14px;flex-shrink:0}
    /* 空状態 */
    .empty-state{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      flex:1;color:var(--text-tertiary);gap:12px;padding:40px 0
    }
    .empty-icon{font-size:48px}
    .empty-text{font-size:15px}
    /* 編集モード */
    .edit-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 0 12px;flex-shrink:0
    }
    .edit-list{gap:12px}
    .edit-item{
      display:flex;flex-direction:column;
      background:var(--bg-secondary);border-radius:var(--radius-md);
      padding:12px 16px;gap:8px;transition:opacity .2s
    }
    .edit-item .row-top{display:flex;align-items:center;gap:12px}
    .drag-handle{
      cursor:grab;color:var(--text-tertiary);
      font-size:18px;padding:4px;flex-shrink:0
    }
    .drag-handle:active{cursor:grabbing}
    .drag-handle svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
    .edit-icon{
      width:36px;height:36px;border-radius:8px;
      background:var(--bg-tertiary);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;overflow:hidden;cursor:pointer;
      font-size:18px;transition:opacity .2s
    }
    .edit-icon:active{opacity:.7}
    .edit-icon img{width:100%;height:100%;object-fit:cover}
    .edit-item input{
      background:transparent;border:none;
      color:var(--text-primary);font-family:var(--font);
      font-size:15px;outline:none;flex:1;min-width:0;
      padding:4px 0;border-bottom:1px solid var(--separator);
      transition:border-color .2s
    }
    .edit-item input:focus{border-bottom-color:var(--accent)}
    .edit-item input::placeholder{color:var(--text-tertiary)}
    .edit-item input.input-url{font-size:13px;color:var(--text-secondary)}
    .delete-btn{
      background:none;border:none;color:var(--danger);
      cursor:pointer;padding:4px 8px;flex-shrink:0;
      border-radius:var(--radius-sm);transition:background-color .2s
    }
    .delete-btn:active{background-color:rgba(255,69,58,.15)}
    .delete-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
    /* 追加ボタン */
    .add-btn{
      display:flex;align-items:center;justify-content:center;gap:8px;
      background:var(--bg-secondary);border:1px dashed var(--separator);
      color:var(--text-secondary);font-family:var(--font);
      font-size:15px;font-weight:500;padding:16px;border-radius:var(--radius-md);
      cursor:pointer;margin-top:12px;transition:background-color .2s,color .2s
    }
    .add-btn:active{background:var(--bg-tertiary);color:var(--text-primary)}
    .add-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
    /* 絵文字ピッカーモーダル */
    .emoji-modal-overlay{
      position:fixed;top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,.6);z-index:100;
      display:flex;align-items:center;justify-content:center;
      animation:fadeIn .2s ease
    }
    .emoji-modal{
      background:var(--bg-secondary);
      border-radius:var(--radius-lg);
      padding:20px;width:320px;max-width:90vw;
      box-shadow:0 8px 32px rgba(0,0,0,.5)
    }
    .emoji-modal-title{
      font-size:15px;font-weight:600;color:var(--text-primary);
      margin-bottom:16px;text-align:center
    }
    .emoji-grid{
      display:grid;grid-template-columns:repeat(6,1fr);
      gap:8px;margin-bottom:16px
    }
    .emoji-option{
      width:44px;height:44px;border-radius:var(--radius-sm);
      background:var(--bg-tertiary);border:none;cursor:pointer;
      font-size:24px;display:flex;align-items:center;justify-content:center;
      transition:background-color .2s,transform .15s
    }
    .emoji-option:active{background:var(--separator);transform:scale(.9)}
    .emoji-modal-close{
      width:100%;padding:10px;border:none;
      background:var(--bg-tertiary);color:var(--text-secondary);
      font-family:var(--font);font-size:14px;font-weight:500;
      border-radius:var(--radius-sm);cursor:pointer;
      transition:background-color .2s
    }
    .emoji-modal-close:active{background:var(--separator)}
    /* アニメーション */
    @keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .link-item,.edit-item{animation:fadeInUp .25s ease both}
    /* SortableJS */
    .sortable-ghost{opacity:.4;background:var(--bg-tertiary)}
    .sortable-chosen{background:var(--bg-tertiary)}
    .sortable-drag{opacity:1!important;background:var(--bg-tertiary);box-shadow:0 8px 24px rgba(0,0,0,.4)}
  </style>
</head>
<body>
  <div id="app">
    <!-- 通常モードヘッダー -->
    <header class="header" id="normalHeader">
      <div class="header-title">links</div>
      <button id="editBtn" class="header-btn" aria-label="Edit">
        <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Edit
      </button>
    </header>
    <!-- 編集モードヘッダー -->
    <header class="header" id="editHeader" style="display:none">
      <button id="cancelBtn" class="header-btn" aria-label="Cancel">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        Cancel
      </button>
      <div class="header-title">Edit</div>
      <button id="saveBtn" class="header-btn primary" aria-label="Save">
        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
        Save
      </button>
    </header>

    <!-- 通常モード -->
    <main id="normalMode" class="mode active">
      <ul id="linkList" class="link-list"></ul>
    </main>

    <!-- 編集モード -->
    <main id="editMode" class="mode">
      <ul id="editList" class="link-list edit-list"></ul>
      <button id="addBtn" class="add-btn" aria-label="Add link">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Add
      </button>
    </main>
  </div>

  <!-- 絵文字ピッカーモーダル -->
  <div id="emojiModal" class="emoji-modal-overlay" style="display:none">
    <div class="emoji-modal">
      <div class="emoji-modal-title">アイコンを選択</div>
      <div class="emoji-grid" id="emojiGrid"></div>
      <button class="emoji-modal-close" id="emojiClose">キャンセル</button>
    </div>
  </div>

  <script>
    // ===== 絵文字リスト =====
    const EMOJIS = ['🔗','📊','📈','📋','📝','📅','💼','🏢','🗂','📁','✅','⏰','💰','🧾','📬','📎','✏️','🗓','📌','⚙️','🔒','🔑','📄','📑'];

    // ===== IndexedDB =====
    const DB_NAME='link-launcher',DB_VERSION=1,STORE_NAME='links';
    let db,links=[],editModeItems=[],isEditMode=false,sortableInstance=null;
    let emojiTargetItem=null; // 絵文字ピッカーの対象アイテム

    function openDB(){
      return new Promise((res,rej)=>{
        const req=indexedDB.open(DB_NAME,DB_VERSION);
        req.onupgradeneeded=e=>{
          const d=e.target.result;
          if(!d.objectStoreNames.contains(STORE_NAME)){
            const s=d.createObjectStore(STORE_NAME,{keyPath:'id'});
            s.createIndex('url','url',{unique:true});
            s.createIndex('order','order')
          }
        };
        req.onsuccess=()=>{db=req.result;res(db)};
        req.onerror=()=>rej(req.error)
      })
    }
    function getAllLinks(){
      return new Promise((res,rej)=>{
        const tx=db.transaction(STORE_NAME,'readonly'),st=tx.objectStore(STORE_NAME),req=st.getAll();
        req.onsuccess=()=>{const l=req.result||[];l.sort((a,b)=>a.order-b.order);res(l)};
        req.onerror=()=>rej(req.error)
      })
    }
    function saveLink(link){
      return new Promise((res,rej)=>{
        const tx=db.transaction(STORE_NAME,'readwrite'),st=tx.objectStore(STORE_NAME);
        st.put(link);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)
      })
    }
    function deleteLink(id){
      return new Promise((res,rej)=>{
        const tx=db.transaction(STORE_NAME,'readwrite'),st=tx.objectStore(STORE_NAME);
        st.delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)
      })
    }
    function generateId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

    // ===== ユーティリティ =====
    function getFaviconUrl(url){
      try{return 'https://www.google.com/s2/favicons?domain='+new URL(url).hostname+'&sz=64'}catch{return ''}
    }
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
    function isValidUrl(s){try{new URL(s);return true}catch{return false}}
    function haptic(){if(navigator.vibrate)navigator.vibrate(10)}
    function isGoogleUrl(url){
      return url.includes('google.com')||url.includes('google.co.jp')||url.includes('accounts.google')
    }
    function isSheetsUrl(url){return url.includes('docs.google.com/spreadsheets')}
    function isDocsUrl(url){return url.includes('docs.google.com/document')}
    function isSlidesUrl(url){return url.includes('docs.google.com/presentation')}

    // ===== リンクを開く =====
    function openLink(link){
      const url=link.url;
      haptic();
      // Googleスプレッドシート → アプリで開く
      if(isSheetsUrl(url)){
        const appUrl=url.replace('https://','googlesheets://');
        window.location.href=appUrl;
        // フォールバック:1.5秒後にブラウザで開く
        setTimeout(()=>{
          if(document.visibilityState==='visible'){
            window.open(url,'_blank','noopener')
          }
        },1500);
        return
      }
      // Googleドキュメント → アプリで開く
      if(isDocsUrl(url)){
        const appUrl=url.replace('https://','googledocs://');
        window.location.href=appUrl;
        setTimeout(()=>{
          if(document.visibilityState==='visible'){
            window.open(url,'_blank','noopener')
          }
        },1500);
        return
      }
      // Googleスライド → アプリで開く
      if(isSlidesUrl(url)){
        const appUrl=url.replace('https://','googleslides://');
        window.location.href=appUrl;
        setTimeout(()=>{
          if(document.visibilityState==='visible'){
            window.open(url,'_blank','noopener')
          }
        },1500);
        return
      }
      // その他のGoogle URL → アカウント選択画面を経由
      if(isGoogleUrl(url)){
        const chooserUrl='https://accounts.google.com/AccountChooser?continue='+encodeURIComponent(url)+'&hl=ja';
        window.open(chooserUrl,'_blank','noopener');
        return
      }
      // 通常のリンク
      window.open(url,'_blank','noopener')
    }

    // ===== DOM参照 =====
    const normalMode=document.getElementById('normalMode');
    const editMode=document.getElementById('editMode');
    const linkList=document.getElementById('linkList');
    const editList=document.getElementById('editList');
    const editBtn=document.getElementById('editBtn');
    const cancelBtn=document.getElementById('cancelBtn');
    const saveBtn=document.getElementById('saveBtn');
    const addBtn=document.getElementById('addBtn');
    const normalHeader=document.getElementById('normalHeader');
    const editHeader=document.getElementById('editHeader');
    const emojiModal=document.getElementById('emojiModal');
    const emojiGrid=document.getElementById('emojiGrid');
    const emojiClose=document.getElementById('emojiClose');

    // ===== 通常モードのレンダリング =====
    function renderNormalMode(){
      linkList.innerHTML='';
      if(links.length===0){
        linkList.innerHTML='<div class="empty-state"><div class="empty-icon">🔗</div><div class="empty-text">No links yet</div><div class="empty-text" style="font-size:13px;">Tap Edit to add links</div></div>';
        return
      }
      links.forEach((link,i)=>{
        const li=document.createElement('li');
        li.className='link-item';
        li.style.animationDelay=(i*0.03)+'s';
        const iconHtml=link.icon
          ?(link.icon.startsWith('http')||link.icon.startsWith('data:')
            ?'<img src="'+link.icon+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.textContent=\'🌐\'">'
            :link.icon)
          :'🌐';
        li.innerHTML='<div class="link-icon">'+iconHtml+'</div><span class="link-title">'+escapeHtml(link.title||link.url)+'</span><span class="link-arrow">↗</span>';
        li.addEventListener('click',()=>openLink(link));
        linkList.appendChild(li)
      })
    }

    // ===== 編集モードのレンダリング =====
    function renderEditMode(){
      editList.innerHTML='';
      editModeItems=links.map(l=>({...l}));
      if(editModeItems.length===0)addEditRow();
      editModeItems.forEach((item,i)=>appendEditRow(item,i));
      initSortable()
    }

    function appendEditRow(item,index){
      const li=document.createElement('li');
      li.className='edit-item';
      li.style.animationDelay=(index*0.03)+'s';
      li.dataset.id=item.id;

      const iconHtml=item.icon
        ?(item.icon.startsWith('http')||item.icon.startsWith('data:')
          ?'<img src="'+item.icon+'" onerror="this.style.display=\'none\';this.parentElement.textContent=\'🌐\'">'
          :item.icon)
        :'🌐';

      li.innerHTML=
        '<div class="row-top">'+
          '<span class="drag-handle" aria-label="Drag to reorder">'+
            '<svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1" fill="currentColor"/><circle cx="15" cy="6" r="1" fill="currentColor"/><circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/><circle cx="9" cy="18" r="1" fill="currentColor"/><circle cx="15" cy="18" r="1" fill="currentColor"/></svg>'+
          '</span>'+
          '<div class="edit-icon" data-index="'+index+'">'+iconHtml+'</div>'+
          '<input type="text" class="input-title" placeholder="Title" value="'+escapeHtml(item.title||'')+'" aria-label="Title">'+
          '<button class="delete-btn" aria-label="Delete">'+
            '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>'+
          '</button>'+
        '</div>'+
        '<input type="url" class="input-url" placeholder="https://example.com" value="'+escapeHtml(item.url||'')+'" aria-label="URL">';

      // タイトル入力
      const titleInput=li.querySelector('.input-title');
      titleInput.addEventListener('input',()=>{item.title=titleInput.value});

      // URL入力
      const urlInput=li.querySelector('.input-url');
      urlInput.addEventListener('input',()=>{
        item.url=urlInput.value;
        updateEditIcon(li,item)
      });
      urlInput.addEventListener('blur',()=>{
        let v=urlInput.value.trim();
        if(v&&!v.match(/^https?:\/\//)){
          v='https://'+v;
          urlInput.value=v;
          item.url=v;
          updateEditIcon(li,item)
        }
      });

      // アイコンクリック → 絵文字ピッカー
      const iconDiv=li.querySelector('.edit-icon');
      iconDiv.addEventListener('click',()=>{
        emojiTargetItem=item;
        showEmojiModal()
      });

      // 削除ボタン
      li.querySelector('.delete-btn').addEventListener('click',()=>{
        editModeItems.splice(index,1);
        renderEditMode()
      });

      editList.appendChild(li)
    }

    function updateEditIcon(li,item){
      const iconDiv=li.querySelector('.edit-icon');
      if(isValidUrl(item.url)&&!item.icon){
        const fav=getFaviconUrl(item.url);
        item.icon=fav;
        iconDiv.innerHTML='<img src="'+fav+'" onerror="this.style.display=\'none\';this.parentElement.textContent=\'🌐\'">'
      }else if(!item.url){
        item.icon='';
        iconDiv.textContent='🌐'
      }
    }

    function addEditRow(){
      const newItem={
        id:generateId(),url:'',title:'',icon:'',order:editModeItems.length,
        createdAt:Date.now(),updatedAt:Date.now()
      };
      editModeItems.push(newItem);
      appendEditRow(newItem,editModeItems.length-1);
      requestAnimationFrame(()=>{
        const rows=editList.querySelectorAll('.edit-item');
        if(rows.length){
          const input=rows[rows.length-1].querySelector('.input-title');
          if(input)input.focus()
        }
      });
      initSortable()
    }

    // ===== SortableJS =====
    function initSortable(){
      if(sortableInstance)sortableInstance.destroy();
      sortableInstance=new Sortable(editList,{
        handle:'.drag-handle',animation:200,
        ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',dragClass:'sortable-drag',
        delay:100,delayOnTouchOnly:true,touchStartThreshold:3,
        onEnd:evt=>{
          const {oldIndex,newIndex}=evt;
          if(oldIndex===newIndex)return;
          const [moved]=editModeItems.splice(oldIndex,1);
          editModeItems.splice(newIndex,0,moved);
          editModeItems.forEach((it,i)=>it.order=i)
        }
      })
    }

    // ===== 絵文字ピッカー =====
    function showEmojiModal(){
      emojiGrid.innerHTML='';
      EMOJIS.forEach(emoji=>{
        const btn=document.createElement('button');
        btn.className='emoji-option';
        btn.textContent=emoji;
        btn.setAttribute('aria-label','Select '+emoji);
        btn.addEventListener('click',()=>{
          if(emojiTargetItem){
            emojiTargetItem.icon=emoji;
            renderEditMode()
          }
          hideEmojiModal()
        });
        emojiGrid.appendChild(btn)
      });
      emojiModal.style.display='flex'
    }
    function hideEmojiModal(){
      emojiModal.style.display='none';
      emojiTargetItem=null
    }
    emojiClose.addEventListener('click',hideEmojiModal);
    emojiModal.addEventListener('click',e=>{
      if(e.target===emojiModal)hideEmojiModal()
    });

    // ===== モード切替 =====
    function showNormalMode(){
      isEditMode=false;
      normalMode.classList.add('active');
      editMode.classList.remove('active');
      normalHeader.style.display='flex';
      editHeader.style.display='none';
      renderNormalMode()
    }
    function showEditMode(){
      isEditMode=true;
      normalMode.classList.remove('active');
      editMode.classList.add('active');
      normalHeader.style.display='none';
      editHeader.style.display='flex';
      renderEditMode()
    }
    async function saveAll(){
      const validItems=editModeItems.filter(it=>isValidUrl(it.url));
      validItems.forEach((it,i)=>{it.order=i;it.updatedAt=Date.now()});
      const ids=new Set(validItems.map(i=>i.id));
      for(const l of links){if(!ids.has(l.id))await deleteLink(l.id)}
      for(const it of validItems)await saveLink(it);
      links=validItems;
      showNormalMode()
    }

    // ===== イベント登録 =====
    editBtn.addEventListener('click',()=>showEditMode());
    cancelBtn.addEventListener('click',()=>showNormalMode());
    saveBtn.addEventListener('click',()=>saveAll());
    addBtn.addEventListener('click',()=>addEditRow());

    // ===== ズーム防止（iOS Safari） =====
    document.addEventListener('gesturestart',e=>e.preventDefault());
    document.addEventListener('dblclick',e=>e.preventDefault());

    // ===== 初期化 =====
    (async()=>{
      await openDB();
      links=await getAllLinks();
      renderNormalMode();
      if('serviceWorker' in navigator){
        window.addEventListener('load',()=>{
          navigator.serviceWorker.register('service-worker.js')
            .then(()=>console.log('SW registered'))
            .catch(e=>console.log('SW failed',e))
        })
      }
    })();
  </script>
</body>
</html>
